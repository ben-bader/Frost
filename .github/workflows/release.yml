# Release workflow — publishes all Frost packages to npm with provenance.
#
# ONE-TIME MANUAL SETUP (required before the first tagged release):
#   1. Publish version 0.1.0 by hand from a maintainer machine (see
#      docs/RELEASING.md) — trusted publishing cannot publish a package
#      that does not exist on the registry yet.
#   2. On npmjs.com, open EACH package (@frost.js/core, @frost.js/router,
#      @frost.js/data, @frost.js/react, @frost.js/server,
#      @frost.js/adapter-node, @frost.js/vite, @frost.js/test,
#      @frost.js/cli, create-frost-app) -> Settings -> Trusted Publisher
#      and configure:
#        - Provider: GitHub Actions
#        - Repository owner: ben-bader  (or the org that owns the repo)
#        - Repository name: Frost
#        - Workflow file name: release.yml
#        - Environment: (leave empty)
#   3. Tag a release (git tag v0.2.0 && git push --tags) — this workflow
#      takes over from then on. It uses OIDC trusted publishing; there is
#      intentionally NO NPM_TOKEN secret.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm version (trusted publishing needs >= 11.5.1)
        run: |
          npm -v
          node -e "const [a,b,c]=process.version.slice(1).split('.').map(Number); if (a<24) { console.error('Node 24 required'); process.exit(1) }"
          npm_version=$(npm -v)
          node -e "const v=process.argv[1].split('.').map(Number); const min=[11,5,1]; for(let i=0;i<3;i++){ if(v[i]!==min[i]){process.exit(v[i]>min[i]?0:1)} } process.exit(0)" "$npm_version" || { echo "npm $npm_version is too old — need >= 11.5.1"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:template

      - name: Pack all packages (dependency order)
        run: node scripts/release-pack.mjs

      - name: Publish tarballs with provenance (OIDC trusted publishing)
        run: |
          set -e
          for tgz in \
            release-tarballs/core/*.tgz \
            release-tarballs/router/*.tgz \
            release-tarballs/data/*.tgz \
            release-tarballs/react/*.tgz \
            release-tarballs/server/*.tgz \
            release-tarballs/adapter-node/*.tgz \
            release-tarballs/vite/*.tgz \
            release-tarballs/test/*.tgz \
            release-tarballs/cli/*.tgz \
            release-tarballs/create-frost-app/*.tgz; do
            echo "Publishing $tgz"
            npm publish "$tgz" --access public --provenance
          done
