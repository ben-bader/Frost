name: CI

on:
  push:
    branches: [main, frost-hardening, release-prep]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:template
      - run: pnpm docs:check
      - run: pnpm docs:check-assets
      - run: node scripts/e2e-pack.mjs
      - name: Audit (non-blocking)
        run: pnpm audit || true
