<text x="430" y="24" text-anchor="middle" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="12" fill="#6f9390">my-app — zsh</text>
<rect class="tl tl21" x="20" y="522" width="620" height="24" fill="#fdecee" opacity="0.55"/>
<text x="28" y="56" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl0"><tspan class="prompt" x="28">$ </tspan><tspan class="cmd" x="46">npm create frost-app@latest my-app</tspan></text>
<text x="28" y="79" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl1"><tspan class="dim" x="28">  Created a Frost starter app in ./my-app</tspan></text>
<text x="28" y="102" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl2"><tspan class="dim" x="28">  Initialized git repository</tspan></text>
<text x="28" y="125" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl3"><tspan class="dim" x="28">  Done! Next steps:</tspan></text>
<text x="28" y="148" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl4"><tspan class="dim" x="28">    cd my-app</tspan></text>
<text x="28" y="171" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl5"><tspan class="prompt" x="28">$ </tspan><tspan class="cmd" x="46">cd my-app &amp;&amp; npm install</tspan></text>
<text x="28" y="194" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl6"><tspan class="dim" x="28">added 87 packages in 4s</tspan></text>
<text x="28" y="217" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl7"><tspan class="prompt" x="28">$ </tspan><tspan class="cmd" x="46">npm run dev</tspan></text>
<text class="tl tl8" x="28" y="240"> </text>
<text x="28" y="263" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl9"><tspan class="mint" x="28">  Frost development server running at http://localhost:3000/</tspan></text>
<text x="28" y="286" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl10"><tspan class="dim" x="28">  GET /playground  loader threw — see below</tspan></text>
<text class="tl tl11" x="28" y="309"> </text>
<g class="tl tl12"><rect x="28" y="318" width="85.2" height="20" rx="4" fill="#ff4d5e"/><text x="37" y="333" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="12" font-weight="700" fill="#fff"> ERROR </text></g>
<text x="28" y="355" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl13"><tspan class="errname" x="28"> Error: Cannot read properties of undefined (reading 'nav')</tspan></text>
<text x="28" y="378" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl14"><tspan class="dim" x="28">  code  FROST_E_LOADER</tspan></text>
<text x="28" y="401" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl15"><tspan class="dim" x="28">  at    src/app/playground/page.tsx:42:11</tspan></text>
<text x="28" y="424" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl16"><tspan class="dim" x="28">  route /playground</tspan></text>
<text x="28" y="447" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl17"><tspan class="dim" x="28">  runtime server</tspan></text>
<text class="tl tl18" x="28" y="470"> </text>
<text x="28" y="493" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl19"><tspan class="gutter" x="28">  40 | export const loader = async () =&gt; {</tspan></text>
<text x="28" y="516" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl20"><tspan class="gutter" x="28">  41 |   const res = await fetch(apiUrl);</tspan></text>
<text x="28" y="539" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl21"><tspan class="marktext" x="28">  42 |   return res.json().nav;</tspan><tspan class="caret" x="307">        ^</tspan></text>
<text x="28" y="562" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl22"><tspan class="gutter" x="28">  43 | };</tspan></text>
<text class="tl tl23" x="28" y="585"> </text>
<g class="tl tl24"><rect x="28" y="594" width="75.6" height="20" rx="4" fill="#ffb86b"/><text x="37" y="609" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="12" font-weight="700" fill="#1a1206"> WARN </text></g>
<text x="28" y="631" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl25"><tspan class="warnname" x="28"> Warning: Nondeterministic render output on /playground</tspan></text>
<text x="28" y="654" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl26"><tspan class="dim" x="28">  code  FROST_E_HYDRATION</tspan></text>
<text x="28" y="677" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="15" class="tl tl27"><tspan class="dim" x="28">  route /playground</tspan></text>

