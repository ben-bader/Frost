<text x="28" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl0"><tspan class="prompt" x="28">$ </tspan><tspan class="cmd" x="46">npm create frost-app@latest my-app</tspan></text>
<text x="28" y="79" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl1"><tspan class="dim" x="28">  Created a Frost starter app in ./my-app</tspan></text>
<text x="28" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl2"><tspan class="dim" x="28">  Initialized git repository</tspan></text>
<text class="tl tl3" x="28" y="125"> </text>
<text x="28" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl4"><tspan class="dim" x="28">  Installing dependencies with npm...</tspan></text>
<text class="tl tl5" x="28" y="171"> </text>
<text x="28" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl6"><tspan class="dim" x="28">  Done! Next steps:</tspan></text>
<text class="tl tl7" x="28" y="217"> </text>
<text x="28" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl8"><tspan class="dim" x="28">    cd my-app</tspan></text>
<text x="28" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl9"><tspan class="dim" x="28">    npm install   # already done</tspan></text>
<text x="28" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl10"><tspan class="dim" x="28">    npm run dev      # start the dev server (http://localhost:3000)</tspan></text>
<text x="28" y="309" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl11"><tspan class="dim" x="28">    npm run build    # production build</tspan></text>
<text x="28" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl12"><tspan class="dim" x="28">    npm start        # serve the production build</tspan></text>
<text x="28" y="355" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl13"><tspan class="prompt" x="28">$ </tspan><tspan class="cmd" x="46">cd my-app &amp;&amp; npm run dev</tspan></text>
<text class="tl tl14" x="28" y="378"> </text>
<text x="28" y="401" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl15"><tspan class="mint" x="28">❄️  Frost development server running at http://localhost:3000/</tspan></text>
<text class="tl tl16" x="28" y="424"> </text>
<g class="tl tl17"><rect x="28" y="433" width="85.2" height="20" rx="4" fill="#ff4d5e"/><text x="37" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#ffffff"> ERROR </text></g>
<text x="28" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl18"><tspan class="plain" x="28"> TypeError: Cannot read properties of undefined (reading 'toUpperCase')</tspan></text>
<text x="28" y="493" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl19"><tspan class="plain" x="28">  code  FROST_E_LOADER</tspan></text>
<text x="28" y="516" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl20"><tspan class="plain" x="28">  at    my-app/src/app/hello/[name]/page.tsx:25:24</tspan></text>
<text x="28" y="539" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl21"><tspan class="plain" x="28">  route /hello/world</tspan></text>
<text x="28" y="562" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" class="tl tl22"><tspan class="plain" x="28">  runtime server</tspan></text>

</svg>
