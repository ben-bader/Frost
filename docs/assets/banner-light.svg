<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Frost — React rendering. Web-native runtime.">
<title>Frost — React rendering. Web-native runtime.</title>
<style>
.bg-grad{fill:url(#bg)}
.glow{animation:drift 18s ease-in-out infinite alternate}
