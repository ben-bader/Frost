<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Frost — social preview">
<title>Frost — social preview</title>
<style>
.glow{animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(50px,-24px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fcfa"/><stop offset="1" stop-color="#e9f4f0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="rgba(11,143,126,0.16)"/><stop offset="1" stop-color="rgba(11,143,126,0)"/></radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<ellipse class="glow" cx="1050" cy="120" rx="420" ry="260" fill="url(#glow)"/>
<ellipse class="glow" style="animation-delay:-9s" cx="200" cy="560" rx="380" ry="220" fill="url(#glow)"/>
<g transform="translate(530 190) scale(4.4)">
<path d="M12 0h38l-6 9H17z" fill="#0b8f7e"/>
<path d="M9 14h28l-5 8H5z" fill="#0e8a76"/>
<path d="M0 44L12 24h6L4 44z" fill="#0a1c1e"/>
</g>
<text x="640" y="400" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" font-weight="600" font-size="110" letter-spacing="6" fill="#143638">FROST</text>
<text x="640" y="470" text-anchor="middle" font-family="'Space Mono',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="30" fill="#0b8f7e">React rendering. Web-native runtime.</text>
<text x="640" y="530" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" fill="#6f9390">npm create frost-app@latest my-app</text>

</svg>
